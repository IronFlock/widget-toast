name: Build and Publish to npm and unpkg

on:
  push:
    tags:
      - "*"

# id-token lets the runner mint the OIDC token npm exchanges for publish rights.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun installs and builds; npm publishes. `bun publish` cannot do npm
      # trusted publishing (oven-sh/bun#22423) — it only knows tokens, and
      # bypass-2FA tokens lose publish in January 2027. So the publish step,
      # and only the publish step, runs on npm.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # No NPM_CONFIG_TOKEN. npm detects the OIDC environment and authenticates
      # against the trusted publisher configured for this package
      # (IronFlock/widget-toast :: build-publish.yml).
      - name: Publish to npm
        # Skips a version that is already on npm: the first @ironflock release of
        # each widget was published by hand (npm only accepts a trusted publisher
        # for an existing package), and its tag still runs this job.
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm, skipping publish"
          else
            npm publish --access public
          fi

      - name: Get the new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.get_version.outputs.version }}" \
            --title "Release ${{ steps.get_version.outputs.version }}" \
            --generate-notes
